project_name: noteutils

version: 2

builds:
  - id: noteutils
    main: ./cmd/noteutils
    binary: noteutils
    ldflags:
      - -extldflags '-static'
    env:
      - CGO_ENABLED=0
    goos: [ linux, darwin ]
    goarch: [ amd64, arm64 ]

archives:
  - id: nix
    builds: [ noteutils ]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- if eq .Os "darwin" }}macOS{{ else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "arm64" }}aarch64{{ else }}{{ .Arch }}{{ end }}
    wrap_in_directory: true
    format: tar.gz

release:
  prerelease: auto
  name_template: "{{.Version}}"
  github:
    owner: nickschuch
    name: noteutils
